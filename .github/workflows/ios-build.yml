name: iOS Simulator build

on:
  push:
    branches: [main]
    paths:
      - 'Carousel/**'
      - 'Carousel.xcodeproj/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Carousel/**'
      - 'Carousel.xcodeproj/**'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

concurrency:
  group: carousel-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Xcode 16.4 / iOS Simulator build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Check project and scheme
        run: xcodebuild -list -project Carousel.xcodeproj

      - name: Build iOS Simulator app
        run: |
          xcodebuild build \
            -project Carousel.xcodeproj \
            -scheme Carousel \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${RUNNER_TEMP}/CarouselDerivedData" \
            CODE_SIGNING_ALLOWED=NO

# No test targets are configured. This job checks compilation, not runtime behavior.
